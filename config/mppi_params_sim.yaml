#----------------------------------------------------#
#   MPPI parameters for ClearPath Jackal Robot       #
#   Author: Ihab S. Mohamed                          #
#   Lab: VAIL, Indiana University Bloomington, USA   #
#----------------------------------------------------# 

# desired target
goal_point: [10.0, 5.1, 0, 0, 0]
# Set the states and control dimensions
state_dim: 5 #包含速度
control_dim: 2

# Set the MPPI parameters
samplingRate: 10.0             # Ts = 1/samplingRate in [s]
time_horizon: 4                # time_horizon in [s]
num_trajectories: 2496
draw_num_traj: 50
exploration_variance: 1200.0
# weights: [5, 5, 2]           # For real-world (for v_max <= 1m/s)
# weights: [2.5, 2.5, 2]         # For simulation .
# weights: [2.5, 2.5, 2, 0 ,0]         # For state_dim: 5
weights: [2.5, 2.5, 2, 0 ,0]         # For state_dim: 5
collision_cost: 10000000
footprint: 0.22

# set the parameters of the Savitsky Galoy filter
SG_window: 51
SG_PolyOrder: 3

# Set the maximum allowable velocities of the robot
max_linear_velocity: 1          # in [m/s]
# max_linear_velocity: 0.75     # For real-world (VAIL Lab)
max_angular_velocity: 1.5       # in [Rad/s]

robot_radius: 0.6 # 机器人半径
safety_dist: 0.3 # 安全距离
dcbf_alpha: 0.1 # cbf参数
dcbf_weight: 1000000 # 
slack_weight: 10 #
check_dist: 5.0 # 障碍物检测距离
ob_num_max: 5 #动态障碍物最大数量,目前数值仿真,由obstacles_param.yaml确定
max_slack_vari: 1.0 # 松弛变量 最大 变化度
atau: 0.0 # 超前时间
soft_cbf: false
IF_aEllipse: false #最开始的扩展椭圆方法，不考虑机器人速度


# Minimum distance to goal
minimumDistance: 0.4

# Costmap parameters
costmap_size: 240               # in [pixels]
costmap_resolution: 0.05        # [m/cell] or Grid size
costmap_origin_x: -6
costmap_origin_y: -6
